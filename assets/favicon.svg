<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Chrome sphere reduced to its essentials: pale sky, one hard tilted horizon, dark floor. -->
    <linearGradient id="chrome" x1="0.38" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#fafbfc"/>
      <stop offset="0.46" stop-color="#a9afb8"/>
      <stop offset="0.5" stop-color="#16181c"/>
      <stop offset="0.78" stop-color="#2b2e34"/>
      <stop offset="1" stop-color="#7d838c"/>
    </linearGradient>
  </defs>
  <style>
    .tile { fill: #e4e6e9; }
    @media (prefers-color-scheme: dark) { .tile { fill: #1f2125; } }
  </style>
  <rect class="tile" width="64" height="64" rx="15"/>
  <circle cx="32" cy="32" r="19.5" fill="url(#chrome)"/>
</svg>
